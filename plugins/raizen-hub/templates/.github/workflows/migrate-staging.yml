name: Migrate staging

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Named so STAGING_DB_URL can live as an environment secret rather than a repo one,
    # which every workflow in the repo can read. Deliberately no required reviewers:
    # this runs on every PR touching migrations, and an approval gate would defeat that.
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$STAGING_DB_URL"
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
